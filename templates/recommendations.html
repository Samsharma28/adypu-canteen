{% extends "base.html" %}{% block title %}Recommended · ADYPU Canteen{% endblock %}{% block content %}
<div class="page-intro"><span class="eyebrow">A LITTLE ADYPU Canteen MAGIC</span><h1>Picked <span>for you.</span></h1><p>{{reason}}.</p></div>
<div class="row g-4">{% for item in items %}<div class="col-6 col-md-4"><div class="food-card"><img src="{{item.image}}" alt="{{item.name}}"><div class="p-3"><span class="food-category">YOUR NEXT FAVOURITE</span><h5>{{item.name}}</h5><div class="d-flex justify-content-between"><b>₹{{'%.0f'|format(item.price)}}</b><a class="btn btn-sm btn-primary rounded-pill" href="{{url_for('menu')}}">View</a></div></div></div></div>{% endfor %}</div>{% endblock %}
